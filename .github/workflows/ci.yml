name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86, Python 3.11
            os: ubuntu-latest
            python-version: "3.11"
          - name: Linux x86, Python 3.12
            os: ubuntu-latest
            python-version: "3.12"
          - name: Windows, Python 3.11
            os: windows-latest
            python-version: "3.11"
          # ARM64, the Raspberry Pi 5's architecture. These are not Pis, but
          # they run the same aarch64 wheels and catch anything that differs
          # from x86. The two mirror the Python and numpy that Raspberry Pi OS
          # ships: Trixie (current) and Bookworm (previous).
          - name: ARM64, Pi OS Trixie stack (Python 3.13, numpy 2)
            os: ubuntu-24.04-arm
            python-version: "3.13"
            benchmark: true
          - name: ARM64, Pi OS Bookworm stack (Python 3.11, numpy 1.24, OpenCV 4.11)
            os: ubuntu-24.04-arm
            python-version: "3.11"
            requirements: requirements-pi-bookworm.txt
            numpy: "1.24.*"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt

      # The GUI build of OpenCV links against libGL and glib, which the Linux
      # runners do not ship. Package names moved around in Ubuntu 24.04, so try
      # the current names first and fall back to the older ones.
      - name: Install OpenCV system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgl1 libglib2.0-0t64 \
            || sudo apt-get install -y -qq libgl1-mesa-glx libglib2.0-0

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [ -n "${{ matrix.requirements }}" ]; then
            pip install -r "${{ matrix.requirements }}" pytest ${{ matrix.numpy && format('"numpy=={0}"', matrix.numpy) || '' }}
          else
            pip install -r requirements-dev.txt
          fi
          python -c "import cv2, numpy; print('OpenCV', cv2.__version__, '| numpy', numpy.__version__)"

      - name: Check the package imports
        run: python -c "import sys; sys.path.insert(0, 'src'); import stereo_vision; print(stereo_vision.__all__)"

      - name: Check the scripts parse their arguments
        shell: bash
        run: |
          for script in scripts/*.py; do
            python "$script" --help > /dev/null
          done

      - name: Run tests
        run: python -m pytest

      # Proves the benchmark runs on ARM64. The numbers come from a shared
      # cloud CPU, not a Pi, so they are not a guide to Pi frame rates.
      - name: Benchmark smoke test
        if: matrix.benchmark
        run: python scripts/benchmark.py --presets pi5,pi5-fast,pi5-bm --threads 4
