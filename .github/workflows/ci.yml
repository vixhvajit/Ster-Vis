name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86, Python 3.11
            os: ubuntu-latest
            python-version: "3.11"
          - name: Linux x86, Python 3.12
            os: ubuntu-latest
            python-version: "3.12"
          - name: Windows, Python 3.11
            os: windows-latest
            python-version: "3.11"
          # ARM64, the Raspberry Pi 5's architecture. These are not Pis, but
          # they run the same aarch64 wheels and catch anything that differs
          # from x86. The two mirror the Python and numpy that Raspberry Pi OS
          # ships: Trixie (current) and Bookworm (previous).
          - name: ARM64, Pi OS Trixie stack (Python 3.13, numpy 2)
            os: ubuntu-24.04-arm
            python-version: "3.13"
            benchmark: true
          - name: ARM64, Pi OS Bookworm stack (Python 3.11, numpy 1.24, OpenCV 4.11)
            os: ubuntu-24.04-arm
            python-version: "3.11"
            constraints: constraints-numpy1.txt
            numpy: "1.24.*"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # The GUI build of OpenCV links against libGL and glib, which the Linux
      # runners do not ship. Package names moved around in Ubuntu 24.04, so try
      # the current names first and fall back to the older ones.
      - name: Install OpenCV system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgl1 libglib2.0-0t64 \
            || sudo apt-get install -y -qq libgl1-mesa-glx libglib2.0-0

      - name: Install the package
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [ -n "${{ matrix.constraints }}" ]; then
            pip install -c "${{ matrix.constraints }}" -e ".[dev]" "numpy==${{ matrix.numpy }}"
          else
            pip install -e ".[dev]"
          fi
          python -c "import cv2, numpy; print('OpenCV', cv2.__version__, '| numpy', numpy.__version__)"
          ster-vis --version

      - name: Run tests
        run: python -m pytest

      # Proves the benchmark runs on ARM64. The numbers come from a shared
      # cloud CPU, not a Pi, so they are not a guide to Pi frame rates.
      - name: Benchmark smoke test
        if: matrix.benchmark
        run: ster-vis benchmark --presets pi5,pi5-fast,pi5-bm --threads 4

  package:
    name: Build and install the package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install OpenCV system libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgl1 libglib2.0-0t64
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Check the wheel's contents
        run: |
          python - <<'EOF'
          import glob, zipfile
          names = zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist()
          required = ["stereo_vision/viewer.html", "stereo_vision/cli/main.py", "LICENSE", "NOTICE"]
          missing = [r for r in required if not any(n.endswith(r) for n in names)]
          stray = [n for n in names if n.startswith(("tests/", "docs/", "output/", "deploy/"))]
          assert not missing, f"missing from wheel: {missing}"
          assert not stray, f"should not be in wheel: {stray}"
          print(f"{len(names)} files, all required present")
          EOF
      - name: Install the wheel in a clean environment and run it outside the repo
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install --quiet dist/*.whl
          mkdir /tmp/elsewhere && cd /tmp/elsewhere
          /tmp/clean/bin/ster-vis --version
          /tmp/clean/bin/python -m stereo_vision --version
          /tmp/clean/bin/ster-vis chessboard
          test -f docs/chessboard_9x6_25mm_a4.pdf
          /tmp/clean/bin/ster-vis check --keep
          /tmp/clean/bin/ster-vis doctor --calibration output/synthetic/stereo.npz
      # A real round trip through ster-vis upgrade: the published 0.1.0 wheel
      # is downloaded, checked against SHA256SUMS and installed over this build
      # by the console script itself, as on a Pi.
      - name: Roll back to a published release with ster-vis upgrade
        run: |
          /tmp/clean/bin/ster-vis upgrade --check
          /tmp/clean/bin/ster-vis upgrade --to 0.1.0
          /tmp/clean/bin/ster-vis --version | grep -qx "ster-vis 0.1.0"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  deploy:
    name: Pi installer and service (ARM64)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Lint the shell scripts
        run: shellcheck deploy/pi/*.sh
      - name: Install system packages the Pi image would already have
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-venv libgl1 libglib2.0-0t64
      # Runs the real installer. The apt step is skipped because picamera2
      # only exists in Raspberry Pi OS; everything else is what a Pi runs.
      - name: Run the installer
        run: sudo STER_VIS_SKIP_APT=1 deploy/pi/install.sh
      - name: Check the installed service
        run: |
          systemd-analyze verify /etc/systemd/system/ster-vis.service
          id ster-vis
          id -nG ster-vis | grep -qw video
          ster-vis --version
          sudo -u ster-vis /opt/ster-vis/venv/bin/ster-vis doctor --calibration /etc/ster-vis/stereo.npz
      - name: Service waits for a calibration instead of failing
        run: |
          sudo systemctl start ster-vis.service
          systemctl show ster-vis.service -p ConditionResult | grep -q "ConditionResult=no"
          systemctl is-failed ster-vis.service && exit 1 || true
      - name: Re-running the installer keeps settings
        run: |
          echo "# custom" | sudo tee -a /etc/ster-vis/ster-vis.env
          sudo STER_VIS_SKIP_APT=1 deploy/pi/install.sh
          grep -q "# custom" /etc/ster-vis/ster-vis.env
      - name: Uninstall
        run: |
          sudo deploy/pi/uninstall.sh --purge
          test ! -e /opt/ster-vis && test ! -e /etc/ster-vis && ! id ster-vis

  ros2:
    name: ROS 2 Jazzy node (official ros:jazzy container)
    runs-on: ubuntu-latest
    container: ros:jazzy
    steps:
      - uses: actions/checkout@v4
      - name: Install
        shell: bash
        run: |
          apt-get update -qq
          apt-get install -y -qq python3-venv python3-pip libgl1 libglib2.0-0t64 \
            ros-jazzy-tf2-ros-py ros-jazzy-sensor-msgs
          source /opt/ros/jazzy/setup.bash
          # ROS's Python message code is built against the system numpy 1.26,
          # which is exactly what constraints-numpy1.txt is for.
          python3 -m venv --system-site-packages /opt/venv
          /opt/venv/bin/pip install --quiet -c constraints-numpy1.txt -e ".[dev]"
          /opt/venv/bin/python -c "import cv2, numpy, rclpy; print('OpenCV', cv2.__version__, '| numpy', numpy.__version__, '| rclpy ok')"
      # ROS installs pytest plugins (launch_testing) written for older pytest;
      # with --system-site-packages the venv's newer pytest would load and
      # reject them. These tests need no plugins, so don't autoload any.
      - name: Test the node against real rclpy
        shell: bash
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          source /opt/ros/jazzy/setup.bash
          /opt/venv/bin/python -m pytest tests/test_ros2.py tests/test_robot.py -v -p no:cacheprovider
