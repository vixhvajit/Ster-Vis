name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.11"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      # The GUI build of OpenCV links against libGL and glib, which the Linux
      # runners do not ship. Package names moved around in Ubuntu 24.04, so try
      # the current names first and fall back to the older ones.
      - name: Install OpenCV system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgl1 libglib2.0-0t64 \
            || sudo apt-get install -y -qq libgl1-mesa-glx libglib2.0-0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Check the package imports
        run: python -c "import sys; sys.path.insert(0, 'src'); import stereo_vision; print(stereo_vision.__all__)"

      - name: Check the scripts parse their arguments
        shell: bash
        run: |
          for script in scripts/*.py; do
            python "$script" --help > /dev/null
          done

      - name: Run tests
        run: python -m pytest
